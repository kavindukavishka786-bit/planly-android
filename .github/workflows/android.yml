name: Build PLANLY APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLANLY_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend
        working-directory: backend
        run: npm test
      - name: Restore a stable development signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: planly-debug-signing-v1-${{ github.repository_id }}
      - name: Create development signing key when missing
        run: |
          if [ ! -f "$PLANLY_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$PLANLY_DEBUG_KEYSTORE")"
            keytool -genkeypair -keystore "$PLANLY_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Verify and assemble
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PLANLY-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
  visual-review:
    name: Capture Android UI
    needs: build
    if: contains(github.event.head_commit.message, '[ui-preview]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: PLANLY-debug-APK
          path: preview-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python scripts/capture_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLANLY-UI-preview
          path: ui-preview/
          if-no-files-found: error
          retention-days: 14
